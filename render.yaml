databases:
  - name: attendance-db
    databaseName: attendance
    user: attendance_user
    plan: free

services:
  - type: web
    name: attendance-tracker-api
    env: node
    rootDir: attendance-tracker1
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: attendance-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: NODE_ENV
        value: production
